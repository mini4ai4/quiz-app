<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Quizzes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0c29;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 32px;
  }

  .app { width: 100%; max-width: 480px; }

  /* ===== HOME SCREEN ===== */
  #screen-home { padding-top: 0; }

  /* Colorful hero banner */
  .hero {
    margin: 0 -16px 28px;
    padding: 48px 24px 36px;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 40%, #e94560 100%);
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -30px;
    width: 220px; height: 220px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .hero-emoji { font-size: 56px; margin-bottom: 10px; position: relative; z-index: 1; }
  .hero-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.5px;
    position: relative; z-index: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.8);
    margin-top: 6px;
    position: relative; z-index: 1;
  }

  /* Decorative dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    position: relative; z-index: 1;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
  }
  .dot.active { background: #fff; width: 22px; border-radius: 4px; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 14px;
  }

  .quiz-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

  .quiz-card {
    background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
    border: 1.5px solid #2a2a5e;
    border-radius: 18px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #6a11cb, #2575fc);
    border-radius: 18px 0 0 18px;
  }
  .quiz-card:nth-child(2)::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
  .quiz-card:nth-child(3)::before { background: linear-gradient(180deg, #4facfe, #00f2fe); }
  .quiz-card:nth-child(4)::before { background: linear-gradient(180deg, #43e97b, #38f9d7); }
  .quiz-card:hover, .quiz-card:active {
    border-color: #4a4a8e;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .quiz-card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; padding-left: 8px; }
  .quiz-card-meta { font-size: 13px; color: #888; padding-left: 8px; }
  .quiz-card-arrow {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    color: #555;
    font-size: 20px;
  }

  .empty-state {
    background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
    border: 2px dashed #2a2a5e;
    border-radius: 18px;
    padding: 40px 20px;
    color: #666;
    font-size: 15px;
    line-height: 1.8;
    text-align: center;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ===== BUTTONS ===== */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    box-shadow: 0 4px 15px rgba(37,117,252,0.4);
  }
  .btn-secondary { background: #16213e; color: #ccc; border: 1.5px solid #2a2a5e; margin-top: 10px; }

  /* ===== QUIZ SCREEN ===== */
  #screen-quiz { display: none; padding-top: 20px; }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #16213e;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-text { font-size: 13px; color: #888; white-space: nowrap; }

  .question-badge {
    display: inline-block;
    background: linear-gradient(135deg, #6a11cb33, #2575fc33);
    border: 1px solid #2575fc55;
    color: #7ab8ff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 14px;
  }

  .question-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 28px;
    min-height: 80px;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }

  .answer-btn {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid #2a2a5e;
    border-radius: 14px;
    background: #16213e;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .answer-btn:active { transform: scale(0.98); }
  .answer-btn:hover { border-color: #3a5a9f; background: #1c2a50; }
  .answer-btn.correct {
    background: linear-gradient(135deg, #0d6b3a, #0a8a4a);
    border-color: #1adb6e;
  }
  .answer-btn.wrong {
    background: linear-gradient(135deg, #6b1a1a, #8a1a1a);
    border-color: #e94560;
  }
  .answer-btn.show-correct {
    background: linear-gradient(135deg, #0d6b3a88, #0a8a4a88);
    border-color: #1adb6e88;
  }
  .answer-btn:disabled { cursor: default; }
  .answer-text { flex: 1; }
  .answer-icon { font-size: 20px; flex-shrink: 0; }

  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    display: none;
    line-height: 1.4;
  }
  .feedback.correct { background: #0d3a22; color: #1adb6e; border: 1px solid #1adb6e44; }
  .feedback.wrong { background: #3a0d0d; color: #ff6b6b; border: 1px solid #e9456044; }

  .next-btn { margin-top: 20px; display: none; }

  /* ===== RESULT SCREEN ===== */
  #screen-result { display: none; text-align: center; padding-top: 20px; }

  .result-hero {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border: 1.5px solid #2a2a5e;
    border-radius: 22px;
    padding: 32px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .result-hero::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(106,17,203,0.2);
    border-radius: 50%;
  }
  .result-emoji { font-size: 64px; margin-bottom: 12px; position: relative; z-index: 1; }
  .result-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; position: relative; z-index: 1; }
  .result-subtitle { font-size: 14px; color: #aaa; position: relative; z-index: 1; }

  .circle-progress {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
  }
  .circle-progress svg { transform: rotate(-90deg); }
  .circle-bg { fill: none; stroke: #1a1a3e; stroke-width: 12; }
  .circle-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
  .circle-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 800;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border: 1.5px solid #2a2a5e;
    border-radius: 14px;
    padding: 16px 10px;
  }
  .stat-num { font-size: 34px; font-weight: 800; }
  .stat-num.green { color: #1adb6e; }
  .stat-num.red { color: #e94560; }
  .stat-num.blue { color: #4da6ff; }
  .stat-num.yellow { color: #f0c040; }
  .stat-label { font-size: 12px; color: #888; margin-top: 3px; }

  /* ===== REVIEW SCREEN ===== */
  #screen-review { display: none; padding-top: 20px; }

  .review-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .review-title { font-size: 22px; font-weight: 800; }

  .review-item {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid #e94560;
  }
  .review-item.ok { border-left-color: #1adb6e; }
  .review-q { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
  .review-your { font-size: 14px; color: #e94560; margin-bottom: 4px; }
  .review-correct { font-size: 14px; color: #1adb6e; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== HOME SCREEN ===== -->
  <div id="screen-home">
    <div class="hero">
      <div class="hero-emoji">🧠</div>
      <div class="hero-title">My Quizzes</div>
      <div class="hero-sub">Practice and remember</div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="section-label">Available Tests</div>
    <div class="quiz-list" id="quiz-list"></div>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">1 / 10</div>
    </div>
    <div class="question-badge" id="question-num">Question 1</div>
    <div class="question-text" id="question-text"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="screen-result">
    <div class="result-hero">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">Great job!</div>
      <div class="result-subtitle" id="result-subtitle"></div>
    </div>

    <div class="circle-progress">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle class="circle-bg" cx="65" cy="65" r="54"/>
        <circle class="circle-fill" id="circle-fill" cx="65" cy="65" r="54"
          stroke-dasharray="339" stroke-dashoffset="339"/>
      </svg>
      <div class="circle-text" id="circle-pct">0%</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num green" id="stat-correct">0</div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-card">
        <div class="stat-num red" id="stat-wrong">0</div>
        <div class="stat-label">Mistakes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num blue" id="stat-total">0</div>
        <div class="stat-label">Total Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-num yellow" id="stat-pct">0%</div>
        <div class="stat-label">Score</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="showReview()" id="btn-review">📋 Review Mistakes</button>
    <button class="btn btn-secondary" onclick="retryQuiz()">🔁 Try Again</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Tests</button>
  </div>

  <!-- ===== REVIEW SCREEN ===== -->
  <div id="screen-review">
    <div class="review-header">
      <div class="review-title">📋 Review Mistakes</div>
    </div>
    <div id="review-list"></div>
    <button class="btn btn-secondary" onclick="showResult()">← Back to Results</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Tests</button>
  </div>

</div>

<script>
let currentQuiz = null;
let currentQuestions = [];
let currentIdx = 0;
let score = 0;
let mistakes = [];
let answered = false;

// ============================================================
// QUESTIONS DATABASE (embedded for instant loading)
// ============================================================
let allQuizzes = [
  {
    title: "Clinical Massage Therapy I — Final Exam (CMT1 · Final)",
    description: "The Soma Institute — Effleurage, Body Mechanics, Draping, Contraindications",
    questions: [
      { question: "How is effleurage performed?", options: ["Effleurage is applied as a rhythmic compression and release of the client's tissue layers, often in a circular pattern.", "Effleurage is applied smoothly and broadly in a centripetal direction on the limbs, using a hand movement away from the therapist's body.", "Effleurage is applied with the muscles of the therapist's forearm alternately contracting and relaxing to create a vibration that is directed into the client's tissue.", "Effleurage is applied in any direction on the client's body, with the hands being pulled toward the therapist."], correct: 1 },
      { question: "If a therapist goes into a deep lunge with the left leg forward, what area of the body is being stretched?", options: ["The right hip flexors", "The left hip flexors", "The right hip Abductors", "The left hip Abductors"], correct: 0 },
      { question: "Several of the following situations are absolutely contraindicated for massage (refer the client out). Which one of the following is still indicated for massage, but requires the treatment to be modified?", options: ["Uncontrolled Hypertension (high blood pressure)", "The client recently took their pain medication.", "The client has unusual, undiagnosed headaches.", "The client has symptoms of the flu."], correct: 1 },
      { question: "Regarding body mechanics, which region of the therapist's body should never exceed 45 to 60 degrees of an angle?", options: ["The distance between their arm and trunk", "The angle of their elbow as force is exerted", "The distance between legs in a lunge", "The angle of the wrist during a gliding stroke"], correct: 0 },
      { question: "Which of the following is TRUE about effleurage?", options: ["Effleurage reflexively relaxes muscles and mobilizes joint capsules.", "When performed without lotion, effleurage increases facial flexibility by moving fascia beyond its restrictions.", "Pressure should gradually increase as this is a warming technique, preparing the tissue for deeper work to follow.", "Effleurage is used to reduce muscle hypertonicity, break up scar tissue, and loosen mucus."], correct: 2 },
      { question: "What are the bony landmarks for abdominal draping?", options: ["Tenth ribs, xiphoid process", "Anterior superior iliac spines, xiphoid process", "Anterior inferior iliac spines, xiphoid process", "Pubic bone, xiphoid process"], correct: 1 },
      { question: "Which of the following are therapeutic effects of tapotement?", options: ["Tapotement decreases sympathetic nervous system firing.", "Tapotement temporarily increases the tone of the muscle.", "Tapotement decreases local circulation.", "Tapotement is used to apply lotion or oil."], correct: 1 },
      { question: "A client reporting high levels of stress in their life, may display any of the following signs or symptoms EXCEPT:", options: ["Hypertonic neck muscles or headaches", "Full deep breaths using the diaphragm", "Gastrointestinal problems", "Shallow or quick breathing patterns"], correct: 1 },
      { question: "Contraindications for deep abdominal massage include:", options: ["Sluggish digestion", "Elevated stress levels", "Diarrhea", "Shallow breathing"], correct: 2 },
      { question: "What is the correct bony landmark for undraping the back?", options: ["Posterior inferior iliac spine", "Anterior superior iliac spine", "Anterior inferior iliac spine", "Posterior superior iliac spine"], correct: 3 },
      { question: "Which of the following is a therapeutic use of a resting position?", options: ["Resting position is used early in a massage to spread lubricant.", "Resting position allows the therapist and client to establish a rhythmic breathing pattern.", "Resting position increases local venous and lymph return.", "Resting position is used to increase tissue and joint mobility."], correct: 1 },
      { question: "What is a therapeutic use of effleurage?", options: ["Effleurage is used to break up scar tissue.", "Effleurage is used to prepare the tissue for deeper techniques.", "Effleurage is used to mobilize spinal segments.", "Effleurage is used to increase local inflammation."], correct: 1 },
      { question: "Why are professional communications an essential component of a treatment?", options: ["Communications allow the therapist to gather information in order to provide the client with a safe and effective treatment.", "Communications ensure that the therapist has an opportunity to answer any questions the client may have about the treatment.", "Communications ensure that the client clearly understands and agrees to the treatment.", "All of the above."], correct: 3 },
      { question: "All of the following are main effects of massage EXCEPT?", options: ["Mechanical effects", "Physiological effects", "Psychological effects", "Auto-Immune effects"], correct: 3 },
      { question: "All of the following are components of informed consent EXCEPT?", options: ["The client understands the treatment plan, all risks and benefits and agrees to the treatment.", "The client understands all financial considerations and possible cancellation policies.", "The client understands he/she cannot stop a treatment at any time.", "The therapist and client establish clear goals and outcomes for the session."], correct: 2 },
      { question: "What is NOT considered a goal of practicing proper body mechanics?", options: ["Proper body mechanics will allow the therapist to use balance and weight transfer, not muscle strength, to perform massage.", "Proper body mechanics will allow the therapist's body to be used in a careful, deliberate, and efficient manner.", "Proper body mechanics will reduce the risk of injury to the therapist.", "Proper body mechanics will allow the therapist to use the most muscle strength, not weight transfer, to create compressive force."], correct: 3 },
      { question: "Which of the following statements is TRUE regarding proper wrist / hand positions during a treatment?", options: ["To apply compressions to the client's posterior leg, the therapist's wrists should be extended to 90°.", "To apply loose fist petrissage to the client's posterior neck, the therapist's wrist joints should move in circular patterns.", "To apply full palm effleurage to the client's posterior leg, the therapist's fingers should be fully extended and off the client's body.", "To apply full palm petrissage to the client's back, the therapist's wrists and fingers should be relaxed and contoured to the client's body."], correct: 3 },
      { question: "Which of the following is a contraindication for effleurage techniques?", options: ["Distal to an injury site when inflammation is present", "Hypertonic Muscle tissue", "Varicose Veins", "A and C"], correct: 3 },
      { question: "Which of the following correctly matches the principle with where to use it on the body?", options: ["The therapist works general to specific, and then back to general-used only when performing cervical work.", "The therapist works proximal to distal, and then back to proximal-used when treating the client's extremities.", "The therapist works superficial to deep, and then back to superficial-used only when we treat the back.", "The therapist works peripheral to central, and then back to peripheral-used all the time during any massage session."], correct: 1 },
      { question: "Which of these sanitation practices, applied as a daily regimen, is most appropriate to prevent the spread of bacteria?", options: ["The therapist only wears protective gloves if the client has an abrasion, open wound, or contagious skin condition.", "The therapist's hands and forearms are vigorously washed with disinfectant soap and lukewarm water before and after each treatment.", "If no sink is available, anti-bacterial hand sanitizer before the first client and after the last client is a suitable substitute to prevent the spread of bacteria.", "The massage table is cleaned with boiling water before and after each treatment."], correct: 1 },
      { question: "All of the following are contraindications for effleurage EXCEPT?", options: ["Distal to an injury", "Varicose veins", "Chronic edema in the lower limb if related to a heart condition", "Hypertonic muscles and connective tissue adhesions"], correct: 3 },
      { question: "If a client has an acute left knee injury with inflammation, what techniques are contraindicated?", options: ["Effleurage distal to injury site", "Effleurage proximal to injury site", "Petrissage proximal to injury site", "Effleurage to the other leg"], correct: 0 },
      { question: "If a client has hypermobile joints, what technique would be contraindicated?", options: ["Tapotement", "Stroking", "Traction", "Petrissage"], correct: 2 },
      { question: "What is the correct bony landmark for undraping one arm?", options: ["Glenohumeral joint", "Bilateral clavicles", "Base of the manubrium", "Glenohumeral joint and ipsilateral clavicle"], correct: 3 },
      { question: "Which of the following best explains the reason(s) for using principles of massage?", options: ["Allows the therapist to work quickly into the tissue so the full body can be addressed in a session.", "Allows the therapist to work only the area where the client is experiencing pain.", "Allows the therapist to provide a safe, effective and efficient treatment following a system of techniques.", "Allows the therapist to work directly into deeper structures, disregarding warming the tissue, to save time during treatment."], correct: 2 }
    ]
  },
  {
    title: "Professional Development 1 (PD1)",
    description: "The Soma Institute — Ethics, HIPAA, Scope of Practice",
    questions: [
      { question: "What is the difference between morals and ethics?", options: ["Ethics are a set of laws used by professional associations to control massage standards of practice.", "Morals are for professionals while ethics are for the general public.", "Ethics are a group decision about what is right and wrong; morals are personal.", "Ethics is a Greek word for morals."], correct: 2 },
      { question: "What is the correct decision-making model to refer to when having an ethical dilemma?", options: ["Gather facts, brainstorm solutions, develop a plan, start the treatment.", "Gather facts, brainstorm solutions, evaluate pros and cons of solutions, evaluate effects on others, choose a solution, reassess.", "Brainstorm solutions, choose a solution, evaluate all pros and cons, start the treatment, reassess.", "Brainstorm solutions, recognize the problem, determine right and wrong, draw a conclusion, start treatment."], correct: 1 },
      { question: "Which of the following statements is NOT in the AMTA Code of Ethics?", options: ["Conduct all business and professional activities within their scope of practice.", "Accept responsibility to do no harm to the physical, mental, and emotional well-being of self, clients, and associates.", "After you complete the proper orthopedic testing and documentation, it is permissible to inform a client of their diagnosis.", "Acknowledge the confidential nature of the professional relationship with clients and respect each client's right to privacy."], correct: 2 },
      { question: "Ethics is a science or study of the following:", options: ["Values.", "Principles.", "Morals.", "All of the above."], correct: 3 },
      { question: "A practitioner working in a spa is assigned a client who is a family member. The client urges the practitioner to break spa policy and provide an add-on treatment of aromatherapy without charging for the service. The best course of action for the practitioner to take is to:", options: ["Inform the client the service can be added and the fee will be charged.", "Proceed with the session and the add-on without charging the family member.", "Cancel the spa appointment and reschedule the session at the practitioner's home office.", "Offer to provide a different add-on that does not obviously affect the supply inventory."], correct: 0 },
      { question: "Your client offers to give you an extra $50 to adjust the vertebrae in their neck during the treatment. If you manually adjust their spine, you are in violation of:", options: ["Informed Consent", "Scope of Practice", "A Dual Relationship", "You are not in violation"], correct: 1 },
      { question: "Ethics is derived from the Greek word ethos meaning:", options: ["Pride.", "Character.", "Kindness.", "Emotion."], correct: 1 },

function loadQuestions() {
  renderHome();
}

function renderHome() {
  const list = document.getElementById('quiz-list');
  if (allQuizzes.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📸</div>
      No tests yet<br><br>
      Take a photo of your printed test and send it to me in Telegram — I'll add it here!
    </div>`;
    return;
  }
  list.innerHTML = allQuizzes.map((q, i) => `
    <div class="quiz-card" onclick="startQuiz(${i})">
      <div class="quiz-card-title">${q.title}</div>
      <div class="quiz-card-meta">${q.questions.length} questions${q.description ? ' · ' + q.description : ''}</div>
      <div class="quiz-card-arrow">›</div>
    </div>
  `).join('');
}

function startQuiz(idx) {
  currentQuiz = allQuizzes[idx];
  currentQuestions = shuffle([...currentQuiz.questions]);
  currentIdx = 0; score = 0; mistakes = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function retryQuiz() {
  currentQuestions = shuffle([...currentQuiz.questions]);
  currentIdx = 0; score = 0; mistakes = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = currentQuestions[currentIdx];
  const total = currentQuestions.length;

  document.getElementById('progress-fill').style.width = ((currentIdx / total) * 100) + '%';
  document.getElementById('progress-text').textContent = (currentIdx + 1) + ' / ' + total;
  document.getElementById('question-num').textContent = 'Question ' + (currentIdx + 1);
  document.getElementById('question-text').textContent = q.question;

  const opts = shuffle(q.options.map((text, i) => ({ text, correct: i === q.correct })));
  document.getElementById('answers').innerHTML = opts.map(opt => `
    <button class="answer-btn" onclick="selectAnswer(this, ${opt.correct})">
      <span class="answer-text">${opt.text}</span>
      <span class="answer-icon"></span>
    </button>
  `).join('');

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIdx];
  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    btn.querySelector('.answer-icon').textContent = '✅';
    score++;
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.answer-icon').textContent = '❌';
    allBtns.forEach(b => {
      const txt = b.querySelector('.answer-text').textContent.trim();
      if (txt === q.options[q.correct]) {
        b.classList.add('show-correct');
        b.querySelector('.answer-icon').textContent = '✅';
      }
    });
    mistakes.push({
      question: q.question,
      yourAnswer: btn.querySelector('.answer-text').textContent.trim(),
      correctAnswer: q.options[q.correct]
    });
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✅ Correct!' : '❌ Wrong. The correct answer is highlighted in green.';
  fb.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIdx + 1 >= currentQuestions.length ? '🏁 Finish Quiz' : 'Next Question →';
}

function nextQuestion() {
  currentIdx++;
  currentIdx >= currentQuestions.length ? showResult() : renderQuestion();
}

function showResult() {
  const total = currentQuestions.length;
  const pct = Math.round((score / total) * 100);
  let emoji, title;
  if (pct >= 90) { emoji = '🏆'; title = 'Excellent result!'; }
  else if (pct >= 70) { emoji = '🎯'; title = 'Good job!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Keep studying!'; }
  else { emoji = '💪'; title = 'You can do better!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = currentQuiz.title;
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = total - score;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('circle-pct').textContent = pct + '%';

  const circumference = 339;
  const circle = document.getElementById('circle-fill');
  circle.style.stroke = pct >= 70 ? '#1adb6e' : pct >= 50 ? '#f0c040' : '#e94560';
  setTimeout(() => { circle.style.strokeDashoffset = circumference - (pct / 100) * circumference; }, 100);
  document.getElementById('btn-review').style.display = mistakes.length > 0 ? 'block' : 'none';
  showScreen('screen-result');
}

function showReview() {
  const list = document.getElementById('review-list');
  list.innerHTML = mistakes.length === 0
    ? '<div style="color:#1adb6e;font-size:18px;text-align:center;padding:20px">🎉 No mistakes!</div>'
    : mistakes.map((m, i) => `
        <div class="review-item">
          <div class="review-q">${i+1}. ${m.question}</div>
          <div class="review-your">❌ Your answer: ${m.yourAnswer}</div>
          <div class="review-correct">✅ Correct: ${m.correctAnswer}</div>
        </div>`).join('');
  showScreen('screen-review');
}

function showScreen(id) {
  ['screen-home','screen-quiz','screen-result','screen-review'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}
function goHome() { showScreen('screen-home'); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
