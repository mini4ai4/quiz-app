<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Quizzes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0c29;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 32px;
  }

  .app { width: 100%; max-width: 480px; }

  /* ===== HOME SCREEN ===== */
  #screen-home { padding-top: 0; }

  /* Colorful hero banner */
  .hero {
    margin: 0 -16px 28px;
    padding: 48px 24px 36px;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 40%, #e94560 100%);
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -30px;
    width: 220px; height: 220px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .hero-emoji { font-size: 56px; margin-bottom: 10px; position: relative; z-index: 1; }
  .hero-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.5px;
    position: relative; z-index: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.8);
    margin-top: 6px;
    position: relative; z-index: 1;
  }

  /* Decorative dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    position: relative; z-index: 1;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
  }
  .dot.active { background: #fff; width: 22px; border-radius: 4px; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 14px;
  }

  .quiz-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

  .quiz-card {
    background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
    border: 1.5px solid #2a2a5e;
    border-radius: 18px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #6a11cb, #2575fc);
    border-radius: 18px 0 0 18px;
  }
  .quiz-card:nth-child(2)::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
  .quiz-card:nth-child(3)::before { background: linear-gradient(180deg, #4facfe, #00f2fe); }
  .quiz-card:nth-child(4)::before { background: linear-gradient(180deg, #43e97b, #38f9d7); }
  .quiz-card:hover, .quiz-card:active {
    border-color: #4a4a8e;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .quiz-card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; padding-left: 8px; }
  .quiz-card-meta { font-size: 13px; color: #888; padding-left: 8px; }
  .quiz-card-arrow {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    color: #555;
    font-size: 20px;
  }

  .empty-state {
    background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
    border: 2px dashed #2a2a5e;
    border-radius: 18px;
    padding: 40px 20px;
    color: #666;
    font-size: 15px;
    line-height: 1.8;
    text-align: center;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ===== BUTTONS ===== */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    box-shadow: 0 4px 15px rgba(37,117,252,0.4);
  }
  .btn-secondary { background: #16213e; color: #ccc; border: 1.5px solid #2a2a5e; margin-top: 10px; }

  /* ===== QUIZ SCREEN ===== */
  #screen-quiz { display: none; padding-top: 20px; }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #16213e;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-text { font-size: 13px; color: #888; white-space: nowrap; }

  .question-badge {
    display: inline-block;
    background: linear-gradient(135deg, #6a11cb33, #2575fc33);
    border: 1px solid #2575fc55;
    color: #7ab8ff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 14px;
  }

  .question-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 28px;
    min-height: 80px;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }

  .answer-btn {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid #2a2a5e;
    border-radius: 14px;
    background: #16213e;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .answer-btn:active { transform: scale(0.98); }
  .answer-btn:hover { border-color: #3a5a9f; background: #1c2a50; }
  .answer-btn.correct {
    background: linear-gradient(135deg, #0d6b3a, #0a8a4a);
    border-color: #1adb6e;
  }
  .answer-btn.wrong {
    background: linear-gradient(135deg, #6b1a1a, #8a1a1a);
    border-color: #e94560;
  }
  .answer-btn.show-correct {
    background: linear-gradient(135deg, #0d6b3a88, #0a8a4a88);
    border-color: #1adb6e88;
  }
  .answer-btn:disabled { cursor: default; }
  .answer-text { flex: 1; }
  .answer-icon { font-size: 20px; flex-shrink: 0; }

  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    display: none;
    line-height: 1.4;
  }
  .feedback.correct { background: #0d3a22; color: #1adb6e; border: 1px solid #1adb6e44; }
  .feedback.wrong { background: #3a0d0d; color: #ff6b6b; border: 1px solid #e9456044; }

  .next-btn { margin-top: 20px; display: none; }

  /* ===== RESULT SCREEN ===== */
  #screen-result { display: none; text-align: center; padding-top: 20px; }

  .result-hero {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border: 1.5px solid #2a2a5e;
    border-radius: 22px;
    padding: 32px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .result-hero::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(106,17,203,0.2);
    border-radius: 50%;
  }
  .result-emoji { font-size: 64px; margin-bottom: 12px; position: relative; z-index: 1; }
  .result-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; position: relative; z-index: 1; }
  .result-subtitle { font-size: 14px; color: #aaa; position: relative; z-index: 1; }

  .circle-progress {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
  }
  .circle-progress svg { transform: rotate(-90deg); }
  .circle-bg { fill: none; stroke: #1a1a3e; stroke-width: 12; }
  .circle-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
  .circle-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 800;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border: 1.5px solid #2a2a5e;
    border-radius: 14px;
    padding: 16px 10px;
  }
  .stat-num { font-size: 34px; font-weight: 800; }
  .stat-num.green { color: #1adb6e; }
  .stat-num.red { color: #e94560; }
  .stat-num.blue { color: #4da6ff; }
  .stat-num.yellow { color: #f0c040; }
  .stat-label { font-size: 12px; color: #888; margin-top: 3px; }

  /* ===== REVIEW SCREEN ===== */
  #screen-review { display: none; padding-top: 20px; }

  .review-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .review-title { font-size: 22px; font-weight: 800; }

  .review-item {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid #e94560;
  }
  .review-item.ok { border-left-color: #1adb6e; }
  .review-q { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
  .review-your { font-size: 14px; color: #e94560; margin-bottom: 4px; }
  .review-correct { font-size: 14px; color: #1adb6e; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== HOME SCREEN ===== -->
  <div id="screen-home">
    <div class="hero">
      <div class="hero-emoji">🧠</div>
      <div class="hero-title">My Quizzes</div>
      <div class="hero-sub">Practice and remember</div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="section-label">Available Tests</div>
    <div class="quiz-list" id="quiz-list"></div>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">1 / 10</div>
    </div>
    <div class="question-badge" id="question-num">Question 1</div>
    <div class="question-text" id="question-text"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="screen-result">
    <div class="result-hero">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">Great job!</div>
      <div class="result-subtitle" id="result-subtitle"></div>
    </div>

    <div class="circle-progress">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle class="circle-bg" cx="65" cy="65" r="54"/>
        <circle class="circle-fill" id="circle-fill" cx="65" cy="65" r="54"
          stroke-dasharray="339" stroke-dashoffset="339"/>
      </svg>
      <div class="circle-text" id="circle-pct">0%</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num green" id="stat-correct">0</div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-card">
        <div class="stat-num red" id="stat-wrong">0</div>
        <div class="stat-label">Mistakes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num blue" id="stat-total">0</div>
        <div class="stat-label">Total Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-num yellow" id="stat-pct">0%</div>
        <div class="stat-label">Score</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="showReview()" id="btn-review">📋 Review Mistakes</button>
    <button class="btn btn-secondary" onclick="retryQuiz()">🔁 Try Again</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Tests</button>
  </div>

  <!-- ===== REVIEW SCREEN ===== -->
  <div id="screen-review">
    <div class="review-header">
      <div class="review-title">📋 Review Mistakes</div>
    </div>
    <div id="review-list"></div>
    <button class="btn btn-secondary" onclick="showResult()">← Back to Results</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Tests</button>
  </div>

</div>

<script>
let currentQuiz = null;
let currentQuestions = [];
let currentIdx = 0;
let score = 0;
let mistakes = [];
let answered = false;

// ============================================================
// QUESTIONS DATABASE (embedded for instant loading)
// ============================================================
let allQuizzes = [
  {
    title: "Professional Development 1 (PD1)",
    description: "The Soma Institute — Ethics, HIPAA, Scope of Practice",
    questions: [
      { question: "What is the difference between morals and ethics?", options: ["Ethics are a set of laws used by professional associations to control massage standards of practice.", "Morals are for professionals while ethics are for the general public.", "Ethics are a group decision about what is right and wrong; morals are personal.", "Ethics is a Greek word for morals."], correct: 2 },
      { question: "What is the correct decision-making model to refer to when having an ethical dilemma?", options: ["Gather facts, brainstorm solutions, develop a plan, start the treatment.", "Gather facts, brainstorm solutions, evaluate pros and cons of solutions, evaluate effects on others, choose a solution, reassess.", "Brainstorm solutions, choose a solution, evaluate all pros and cons, start the treatment, reassess.", "Brainstorm solutions, recognize the problem, determine right and wrong, draw a conclusion, start treatment."], correct: 1 },
      { question: "Which of the following statements is NOT in the AMTA Code of Ethics?", options: ["Conduct all business and professional activities within their scope of practice.", "Accept responsibility to do no harm to the physical, mental, and emotional well-being of self, clients, and associates.", "After you complete the proper orthopedic testing and documentation, it is permissible to inform a client of their diagnosis.", "Acknowledge the confidential nature of the professional relationship with clients and respect each client's right to privacy."], correct: 2 },
      { question: "Ethics is a science or study of the following:", options: ["Values.", "Principles.", "Morals.", "All of the above."], correct: 3 },
      { question: "A practitioner working in a spa is assigned a client who is a family member. The client urges the practitioner to break spa policy and provide an add-on treatment of aromatherapy without charging for the service. The best course of action for the practitioner to take is to:", options: ["Inform the client the service can be added and the fee will be charged.", "Proceed with the session and the add-on without charging the family member.", "Cancel the spa appointment and reschedule the session at the practitioner's home office.", "Offer to provide a different add-on that does not obviously affect the supply inventory."], correct: 0 },
      { question: "Your client offers to give you an extra $50 to adjust the vertebrae in their neck during the treatment. If you manually adjust their spine, you are in violation of:", options: ["Informed Consent", "Scope of Practice", "A Dual Relationship", "You are not in violation"], correct: 1 },
      { question: "Ethics is derived from the Greek word ethos meaning:", options: ["Pride.", "Character.", "Kindness.", "Emotion."], correct: 1 },
      { question: "A personal code of ethics provides ______ to which you can refer when needed.", options: ["Excuses.", "Goals.", "Standards.", "Credentials."], correct: 2 },
      { question: "Which option would be an illegal reason for a Massage Therapist to decline treating a client?", options: ["The therapist does not practice the desired modality.", "The therapist declines a client because of their ethnic background.", "The client was involved in an accident and has not been cleared by their Medical Doctor for massage.", "The client has made numerous sexual remarks even though they have been told it is inappropriate and unacceptable."], correct: 1 },
      { question: "The knowledge base and practice parameters of a profession are called ______.", options: ["Scope of practice", "Informed consent", "Ethics", "Therapeutic relationship"], correct: 0 },
      { question: "The definition of Informed Consent is:", options: ["Exercise the right to refuse to treat any person or part of the body for just and reasonable cause.", "Permission to receive treatment is given after the therapeutic goals, effects, side effects, and protocols are thoroughly explained to the client.", "The science or study of morals, values, and principles.", "A law to protect an individual's right to privacy pertaining to their health records."], correct: 1 },
      { question: "From discussions in class, we have acknowledged that our profession is not only about hands-on skills, but we are in customer relations (service) as well. Which of the following are important components to achieve a high standard of service with a client?", options: ["Having excellent communication techniques, which involves good listening skills, eye contact, and a genuine desire to always be present in the therapeutic relationship.", "Following up with a client after a session to see if the treatment had the desired change.", "Having a personal code of ethics statement that you will treat clients fairly and equally.", "All of the above."], correct: 3 },
      { question: "A practitioner receives an invitation to participate at an on-site chair massage event in a state in which the practitioner is not licensed. Compensation is being offered for participating. What is the best course of action for the practitioner?", options: ["Decline the offer because participating would be illegal.", "Provide chair massage since it is only a one-time event.", "Participate but do not report the income from the event.", "Borrow a license and participate in the event."], correct: 0 },
      { question: "Your client refers her best friend to you. They are the last two clients on your schedule for the day. After treating them both, they invite you out for a bite to eat to celebrate how well they feel. Which of the following is the most appropriate ethical response?", options: ["Say thank you but inform them you do not see clients socially.", "Offer to pay the bill, but do not join them.", "Grab your coat and take them to your favorite spot.", "Politely decline for the dinner portion and then meet them after for a drink."], correct: 0 },
      { question: "The process by which groups, associations, and professional affiliations will set specific guidelines, expectations, and repercussions for inappropriate behavior is called:", options: ["Censure.", "Self-regulations.", "Standards of Practice.", "Self-limitations."], correct: 2 },
      { question: "A client tells you they don't mind if you remain in the room while they disrobe. Which of the following is the most appropriate response?", options: ["Turn around while they disrobe so you do not accidentally see them.", "Tell the client you would prefer to give them privacy and leave the room.", "Stay in the room and get your supplies together; it will give you a few more minutes to work.", "Immediately tell the client you do not appreciate their sexual advance and end the session before it begins."], correct: 1 },
      { question: "A new therapist gets hired at an upscale facility. Within the first few weeks, the therapist becomes concerned about possible unethical practices. What should the therapist do?", options: ["Seek advice from a mentor, instructor, or professional association.", "Don't acknowledge the concerns; it's not your establishment.", "Avoid confrontation; doing so can result in additional income.", "Start spreading rumors about the place."], correct: 0 },
      { question: "A client has been seeing you for pain in their left knee. You've completed an assessment of the knee and multiple massage sessions over the past 8 weeks, but they are not improving. What is the most ethical response?", options: ["Sell them another package of services and continue with treatment.", "During your reassessment, avoid charting negative treatment findings.", "Refer them to an orthopedic, chiropractic, or knee specialist.", "Try to explain that they are feeling better but are unaware of their own body."], correct: 2 },
      { question: "A dual relationship is which of the following examples:", options: ["You are treating a referred client from your chiropractor for his low back pain.", "You have a very good client that wants to refer a friend of theirs to you that suffers tension headaches.", "You have arranged an agreement to barter services with your hairstylist.", "Your former dog walker has scheduled an appointment for shoulder pain."], correct: 2 },
      { question: "When a client starts seeing their therapist in personal or unrealistic light (calls you doctor, a magician, their hero, etc.) instead of addressing you in a professional manner; this ethical issue is called:", options: ["Boundaries.", "Transference.", "Counter transference.", "A normal response to effective work."], correct: 1 },
      { question: "The best ethical way to diffuse feelings of sexual arousal in a treatment is:", options: ["Recognize the physiology and interrupt it by changing what you are doing.", "Stop the massage immediately and call the police.", "Embarrass the client so the feelings go away.", "Pretend not to notice and hope they do not rebook with you."], correct: 0 },
      { question: "Which option is often a result of engaging in a dual relationship with a client?", options: ["Dual relationships create total harmony in your personal life.", "Dual relationships help clarify your judgment regarding ethical issues.", "Dual relationships often lead clients to expect favors from you.", "Dual relationships strengthen the therapeutic bond between you and your client."], correct: 2 },
      { question: "Which of the following describes HIPAA? (Health Insurance Portability and Accountability Act)", options: ["Credentials.", "Clinical reasoning.", "Orthopedic testing.", "Privacy standards."], correct: 3 },
      { question: "You join your significant other and his/her boss, Mr. Smith, for dinner. In the course of conversation, everyone starts discussing Mr. Smith's tension headaches. After dinner, Mr. Smith approaches you and wants to book an appointment with you. Ethically, why or why not take the appointment?", options: ["Book the appointment; it is ethical for you to work on them.", "Decline: it is unlawful to work on them.", "Refer out; it's out of your scope of practice.", "Going to dinner in the first place was an unethical act."], correct: 0 },
      { question: "Which of the following is a violation of confidentiality?", options: ["Contacting authorities when you suspect a third party is in danger.", "Asking the client questions pertaining to their life or job environment that might impact their posture.", "Initiating contact and speaking to a client in a restaurant.", "Speaking to a client's chiropractor with appropriate releases."], correct: 2 },
      { question: "The rules governing practice for a licensed massage professional are defined as the:", options: ["Scope of practice", "Professional boundaries", "Evaluate domains", "Code of ethics"], correct: 0 },
      { question: "A practitioner encounters a regular client while attending a music concert. The most appropriate course of action for the practitioner to take is to:", options: ["Let the client determine whether or not they wish to acknowledge the practitioner.", "Terminate the client/practitioner relationship immediately.", "Acknowledge the client and ask how they are doing.", "Use the opportunity to schedule another appointment with the client."], correct: 0 },
      { question: "Which established set of guidelines must a massage practitioner adhere to for protecting the client and providing clear direction for practitioner behavior and boundaries?", options: ["Code of ethics", "Cancellation policy", "Certification", "Treatment plan"], correct: 0 },
      { question: "Which of the following would be appropriate to discuss with a client during a massage?", options: ["Tissue feedback", "Sexual history", "Client retention rates", "Relationship issues"], correct: 0 },
      { question: "What guideline may a practitioner enact when, after discussing the therapeutic relationship, a client continues a behavior that is inappropriate in the therapy room and makes the practitioner uncomfortable with each session?", options: ["Right of refusal", "Release consent", "Informed reporting", "Sequential intervention"], correct: 0 }
    ]
  },
  {
    title: "Clinical Integration 1 Quiz #1 (CI1 · Q1)",
    description: "The Soma Institute — OLDRFICARA, OPPQRST & SOAP Notes",
    questions: [
      { question: "What makes your pain worse?", options: ["A","O","I","R"], correct: 0 },
      { question: "On a pain scale from 1-10, can you rate your level of pain?", options: ["I","D","A","C"], correct: 0 },
      { question: "When did the pain start?", options: ["D","O","A","F"], correct: 1 },
      { question: "Can you describe your neck pain for me?", options: ["O","L","D","C"], correct: 3 },
      { question: "Is there anything that makes your pain better?", options: ["R","F","A","O"], correct: 0 },
      { question: "Does the pain travel anywhere else in your body?", options: ["Q","R","S","T"], correct: 1 },
      { question: "When you are experiencing your neck pain, how long does it last?", options: ["O","P","R","T"], correct: 3 },
      { question: "Because Jane still has some trigger points and tightness in her neck after your treatment, you recommend that she perform some stretches for her neck at home and you show her how they should be done. Where do you record the stretches you showed her to perform at home in your SOAP note?", options: ["S","O","A","P"], correct: 3 },
      { question: "While looking at Jane about her neck pain, you observed her neck was laterally flexed more to the right side and she grimaced if she moved her neck too much. Where would you record this in your SOAP note?", options: ["S","O","A","P"], correct: 1 },
      { question: "Jane is very happy with the work you have performed on her neck and wants to know when she should schedule another appointment. You tell Jane that because she still has trigger points and tightness in her neck, she would benefit from having massage once a week over the next four weeks. She tells you to go ahead and schedule those appointments. Where would you record her upcoming treatments in your SOAP note?", options: ["S","O","A","P"], correct: 3 },
      { question: "After your treatment, Jane states her pain has decreased and she is already feeling better. Where would you record this information in your SOAP note?", options: ["S","O","A","P"], correct: 2 },
      { question: "After you finish the treatment, you re-run the active range of motion tests and you observe that Jane has more range of motion than she did before the treatment started. Where would you record this information in your SOAP note?", options: ["S","O","A","P"], correct: 2 },
      { question: "You palpate the muscles of Jane's neck to determine what muscles need to be treated and you find a trigger point in her right levator scapula muscle. Where would you record this finding in your SOAP note?", options: ["S","O","A","P"], correct: 1 },
      { question: "After performing a few more tests, you decided that you would use heat on Jane's neck for 15 minutes, perform trigger point work and myofascial release for a total treatment time of 30 minutes. Where would you record this in your SOAP note?", options: ["S","O","A","P"], correct: 1 },
      { question: "After you complete OLDRFICARA, you document what Jane has told you about her neck pain. Where would you record this information in your SOAP note?", options: ["S","O","A","P"], correct: 0 },
      { question: "When a client states that they have Carpal Tunnel Syndrome during the initial intake, where does the therapist record this information?", options: ["On the informed consent form","Under the S in SOAP Notes","On a star diagram","Under the O in SOAP Notes"], correct: 1 },
      { question: "If you need to refer your client to a primary care physician, where do you record that information in your SOAP note?", options: ["S","O","A","P"], correct: 3 },
      { question: "Palpation findings (4 T's of palpation) such as hypertonicity in an area, temperature differences, or an area being too tender to work should be recorded in which part of the SOAP note?", options: ["S","O","A","P"], correct: 1 },
      { question: "Which letter in SOAP is used to record information regarding the result of the therapist's treatment?", options: ["S","O","A","P"], correct: 2 },
      { question: "Which letter correctly corresponds to the SOAP acronym?", options: ["S – Severity","O – Observations","A – Associated","P – Plan"], correct: 3 }
    ]
  }
];

function loadQuestions() {
  renderHome();
}

function renderHome() {
  const list = document.getElementById('quiz-list');
  if (allQuizzes.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📸</div>
      No tests yet<br><br>
      Take a photo of your printed test and send it to me in Telegram — I'll add it here!
    </div>`;
    return;
  }
  list.innerHTML = allQuizzes.map((q, i) => `
    <div class="quiz-card" onclick="startQuiz(${i})">
      <div class="quiz-card-title">${q.title}</div>
      <div class="quiz-card-meta">${q.questions.length} questions${q.description ? ' · ' + q.description : ''}</div>
      <div class="quiz-card-arrow">›</div>
    </div>
  `).join('');
}

function startQuiz(idx) {
  currentQuiz = allQuizzes[idx];
  currentQuestions = shuffle([...currentQuiz.questions]);
  currentIdx = 0; score = 0; mistakes = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function retryQuiz() {
  currentQuestions = shuffle([...currentQuiz.questions]);
  currentIdx = 0; score = 0; mistakes = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = currentQuestions[currentIdx];
  const total = currentQuestions.length;

  document.getElementById('progress-fill').style.width = ((currentIdx / total) * 100) + '%';
  document.getElementById('progress-text').textContent = (currentIdx + 1) + ' / ' + total;
  document.getElementById('question-num').textContent = 'Question ' + (currentIdx + 1);
  document.getElementById('question-text').textContent = q.question;

  const opts = shuffle(q.options.map((text, i) => ({ text, correct: i === q.correct })));
  document.getElementById('answers').innerHTML = opts.map(opt => `
    <button class="answer-btn" onclick="selectAnswer(this, ${opt.correct})">
      <span class="answer-text">${opt.text}</span>
      <span class="answer-icon"></span>
    </button>
  `).join('');

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIdx];
  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    btn.querySelector('.answer-icon').textContent = '✅';
    score++;
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.answer-icon').textContent = '❌';
    allBtns.forEach(b => {
      const txt = b.querySelector('.answer-text').textContent.trim();
      if (txt === q.options[q.correct]) {
        b.classList.add('show-correct');
        b.querySelector('.answer-icon').textContent = '✅';
      }
    });
    mistakes.push({
      question: q.question,
      yourAnswer: btn.querySelector('.answer-text').textContent.trim(),
      correctAnswer: q.options[q.correct]
    });
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✅ Correct!' : '❌ Wrong. The correct answer is highlighted in green.';
  fb.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIdx + 1 >= currentQuestions.length ? '🏁 Finish Quiz' : 'Next Question →';
}

function nextQuestion() {
  currentIdx++;
  currentIdx >= currentQuestions.length ? showResult() : renderQuestion();
}

function showResult() {
  const total = currentQuestions.length;
  const pct = Math.round((score / total) * 100);
  let emoji, title;
  if (pct >= 90) { emoji = '🏆'; title = 'Excellent result!'; }
  else if (pct >= 70) { emoji = '🎯'; title = 'Good job!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Keep studying!'; }
  else { emoji = '💪'; title = 'You can do better!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = currentQuiz.title;
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = total - score;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('circle-pct').textContent = pct + '%';

  const circumference = 339;
  const circle = document.getElementById('circle-fill');
  circle.style.stroke = pct >= 70 ? '#1adb6e' : pct >= 50 ? '#f0c040' : '#e94560';
  setTimeout(() => { circle.style.strokeDashoffset = circumference - (pct / 100) * circumference; }, 100);
  document.getElementById('btn-review').style.display = mistakes.length > 0 ? 'block' : 'none';
  showScreen('screen-result');
}

function showReview() {
  const list = document.getElementById('review-list');
  list.innerHTML = mistakes.length === 0
    ? '<div style="color:#1adb6e;font-size:18px;text-align:center;padding:20px">🎉 No mistakes!</div>'
    : mistakes.map((m, i) => `
        <div class="review-item">
          <div class="review-q">${i+1}. ${m.question}</div>
          <div class="review-your">❌ Your answer: ${m.yourAnswer}</div>
          <div class="review-correct">✅ Correct: ${m.correctAnswer}</div>
        </div>`).join('');
  showScreen('screen-review');
}

function showScreen(id) {
  ['screen-home','screen-quiz','screen-result','screen-review'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}
function goHome() { showScreen('screen-home'); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

loadQuestions();
</script>
