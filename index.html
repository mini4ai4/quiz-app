<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Big Brain Energy — Soma Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0c29;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 32px;
  }

  .app { width: 100%; max-width: 480px; }

  /* ===== HOME SCREEN ===== */
  #screen-home { padding-top: 0; }

  /* Colorful hero banner */
  .hero {
    margin: 0 -16px 28px;
    padding: 48px 24px 36px;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 40%, #e94560 100%);
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -30px;
    width: 220px; height: 220px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .hero-emoji { font-size: 56px; margin-bottom: 10px; position: relative; z-index: 1; }
  .hero-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.5px;
    position: relative; z-index: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.8);
    margin-top: 6px;
    position: relative; z-index: 1;
  }

  /* Decorative dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    position: relative; z-index: 1;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
  }
  .dot.active { background: #fff; width: 22px; border-radius: 4px; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 14px;
  }

  .quiz-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

  .quiz-card {
    background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
    border: 1.5px solid #2a2a5e;
    border-radius: 18px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #6a11cb, #2575fc);
    border-radius: 18px 0 0 18px;
  }
  .quiz-card:nth-child(2)::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
  .quiz-card:nth-child(3)::before { background: linear-gradient(180deg, #4facfe, #00f2fe); }
  .quiz-card:nth-child(4)::before { background: linear-gradient(180deg, #43e97b, #38f9d7); }
  .quiz-card:hover, .quiz-card:active {
    border-color: #4a4a8e;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .quiz-card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; padding-left: 8px; }
  .quiz-card-meta { font-size: 13px; color: #888; padding-left: 8px; }
  .quiz-card-arrow {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    color: #555;
    font-size: 20px;
  }

  .empty-state {
    background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
    border: 2px dashed #2a2a5e;
    border-radius: 18px;
    padding: 40px 20px;
    color: #666;
    font-size: 15px;
    line-height: 1.8;
    text-align: center;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ===== BUTTONS ===== */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    box-shadow: 0 4px 15px rgba(37,117,252,0.4);
  }
  .btn-secondary { background: #16213e; color: #ccc; border: 1.5px solid #2a2a5e; margin-top: 10px; }

  /* ===== QUIZ SCREEN ===== */
  #screen-quiz { display: none; padding-top: 12px; }

  .quiz-topbar {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .back-home-btn {
    background: none;
    border: none;
    color: #7ab8ff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0;
    letter-spacing: 0.2px;
  }
  .back-home-btn:active { opacity: 0.6; }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #16213e;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-text { font-size: 13px; color: #888; white-space: nowrap; }

  .question-badge {
    display: inline-block;
    background: linear-gradient(135deg, #6a11cb33, #2575fc33);
    border: 1px solid #2575fc55;
    color: #7ab8ff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 99px;
  }

  .question-toprow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .question-toprow .question-badge { margin-bottom: 0; }

  .translate-btn {
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 99px;
    color: #ccc;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .translate-btn:hover { background: rgba(255,255,255,0.15); }
  .translate-btn:active { transform: scale(0.95); }
  .translate-btn:disabled { opacity: 0.5; cursor: default; }

  .question-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 28px;
    min-height: 80px;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }

  .answer-btn {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid #2a2a5e;
    border-radius: 14px;
    background: #16213e;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .answer-btn:active { transform: scale(0.98); }
  .answer-btn:hover { border-color: #3a5a9f; background: #1c2a50; }
  .answer-btn.correct {
    background: linear-gradient(135deg, #0d6b3a, #0a8a4a);
    border-color: #1adb6e;
  }
  .answer-btn.wrong {
    background: linear-gradient(135deg, #6b1a1a, #8a1a1a);
    border-color: #e94560;
  }
  .answer-btn.show-correct {
    background: linear-gradient(135deg, #0d6b3a88, #0a8a4a88);
    border-color: #1adb6e88;
  }
  .answer-btn:disabled { cursor: default; }
  .answer-text { flex: 1; }
  .answer-icon { font-size: 20px; flex-shrink: 0; }

  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    display: none;
    line-height: 1.4;
  }
  .feedback.correct { background: #0d3a22; color: #1adb6e; border: 1px solid #1adb6e44; }
  .feedback.wrong { background: #3a0d0d; color: #ff6b6b; border: 1px solid #e9456044; }

  .next-btn { margin-top: 20px; display: none; }

  /* ===== RESULT SCREEN ===== */
  #screen-result { display: none; text-align: center; padding-top: 20px; }

  .result-hero {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border: 1.5px solid #2a2a5e;
    border-radius: 22px;
    padding: 32px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .result-hero::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(106,17,203,0.2);
    border-radius: 50%;
  }
  .result-emoji { font-size: 64px; margin-bottom: 12px; position: relative; z-index: 1; }
  .result-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; position: relative; z-index: 1; }
  .result-subtitle { font-size: 14px; color: #aaa; position: relative; z-index: 1; }

  .circle-progress {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
  }
  .circle-progress svg { transform: rotate(-90deg); }
  .circle-bg { fill: none; stroke: #1a1a3e; stroke-width: 12; }
  .circle-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
  .circle-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 800;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border: 1.5px solid #2a2a5e;
    border-radius: 14px;
    padding: 16px 10px;
  }
  .stat-num { font-size: 34px; font-weight: 800; }
  .stat-num.green { color: #1adb6e; }
  .stat-num.red { color: #e94560; }
  .stat-num.blue { color: #4da6ff; }
  .stat-num.yellow { color: #f0c040; }
  .stat-label { font-size: 12px; color: #888; margin-top: 3px; }

  /* ===== REVIEW SCREEN ===== */
  #screen-review { display: none; padding-top: 20px; }

  .review-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .review-title { font-size: 22px; font-weight: 800; }

  .review-item {
    background: linear-gradient(135deg, #1a1a3e, #16213e);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid #e94560;
  }
  .review-item.ok { border-left-color: #1adb6e; }
  .review-q { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
  .review-your { font-size: 14px; color: #e94560; margin-bottom: 4px; }
  .review-correct { font-size: 14px; color: #1adb6e; }

  /* ===== FINAL EXAM CARD ===== */
  .quiz-card.final {
    background: linear-gradient(135deg, #1e1500 0%, #110d00 100%);
    border: 1.5px solid #b8860b;
  }
  .quiz-card.final::before {
    background: linear-gradient(180deg, #f0c040, #e8860a) !important;
  }
  .quiz-card.final .quiz-card-title { color: #f0c040; }
  .quiz-card.final:hover, .quiz-card.final:active {
    border-color: #f0c040;
    box-shadow: 0 8px 24px rgba(240,192,64,0.25);
  }

  /* ===== SUPPORT / DONATE ===== */
  .support-box {
    margin-top: 32px;
    background: linear-gradient(135deg, #0d1a2e 0%, #0a1020 100%);
    border: 1.5px solid #1e3a5f;
    border-radius: 18px;
    padding: 20px 18px 18px;
    text-align: center;
  }
  .support-title {
    font-size: 16px;
    font-weight: 700;
    color: #ccc;
    margin-bottom: 4px;
  }
  .support-sub {
    font-size: 12px;
    color: #555;
    margin-bottom: 14px;
  }
  .donate-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .donate-btn {
    display: inline-block;
    padding: 9px 18px;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    text-decoration: none;
    transition: all 0.15s;
    border: 1.5px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(6px);
  }
  .donate-btn:active { transform: scale(0.96); }
  .donate-btn:hover { background: rgba(255,255,255,0.28); }
  .donate-custom {
    background: rgba(240,192,64,0.25);
    border-color: rgba(240,192,64,0.6);
  }
  .donate-custom:hover { background: rgba(240,192,64,0.38); }

  /* Question source label */
  .q-source {
    font-size: 12px;
    color: #777;
    margin-top: -16px;
    margin-bottom: 22px;
    font-style: italic;
    padding-left: 2px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== HOME SCREEN ===== -->
  <div id="screen-home">
    <div class="hero">
      <div class="hero-emoji">🧠</div>
      <div class="hero-title">Big Brain Energy — Soma Edition</div>
      <div class="hero-sub">Practice and remember</div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Support section inside hero -->
      <div style="font-size:13px; color:rgba(255,255,255,0.75); margin-top:20px; position:relative; z-index:1; font-weight:600;">Enjoying the app? Treat me 🙏</div>
      <div class="donate-btns" style="margin-top:10px; position:relative; z-index:1;">
        <a class="donate-btn" href="https://buy.stripe.com/fZu5kDdJB8YAdr28UL6J207" target="_blank">☕ $5</a>
        <a class="donate-btn" href="https://buy.stripe.com/28E7sL20TdeQbiUb2T6J208" target="_blank">🍫 $10</a>
        <a class="donate-btn" href="https://buy.stripe.com/aFa7sL34XcaMdr2db16J209" target="_blank">🍣 $20</a>
        <a class="donate-btn donate-custom" href="https://buy.stripe.com/28E00jcFxgr25YA9YP6J206" target="_blank">Custom 💛</a>
      </div>
      <div style="font-size:11px; color:rgba(255,255,255,0.45); margin-top:8px; position:relative; z-index:1;">Apple Pay &amp; all cards</div>
    </div>

    <div class="section-label">Available Tests</div>
    <div class="quiz-list" id="quiz-list"></div>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="screen-quiz">
    <div class="quiz-topbar">
      <button class="back-home-btn" onclick="goHome()">← Tests</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">1 / 10</div>
    </div>
    <div class="question-toprow">
      <div class="question-badge" id="question-num">Question 1</div>
      <button class="translate-btn" id="translate-btn" onclick="toggleTranslate()">🇷🇺 RU</button>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="q-source" id="question-source" style="display:none"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="screen-result">
    <div class="result-hero">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">Great job!</div>
      <div class="result-subtitle" id="result-subtitle"></div>
    </div>

    <div class="circle-progress">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle class="circle-bg" cx="65" cy="65" r="54"/>
        <circle class="circle-fill" id="circle-fill" cx="65" cy="65" r="54"
          stroke-dasharray="339" stroke-dashoffset="339"/>
      </svg>
      <div class="circle-text" id="circle-pct">0%</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num green" id="stat-correct">0</div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-card">
        <div class="stat-num red" id="stat-wrong">0</div>
        <div class="stat-label">Mistakes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num blue" id="stat-total">0</div>
        <div class="stat-label">Total Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-num yellow" id="stat-pct">0%</div>
        <div class="stat-label">Score</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="showReview()" id="btn-review">📋 Review Mistakes</button>
    <button class="btn btn-secondary" onclick="retryQuiz()">🔁 Try Again</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Tests</button>
  </div>

  <!-- ===== REVIEW SCREEN ===== -->
  <div id="screen-review">
    <div class="review-header">
      <div class="review-title">📋 Review Mistakes</div>
    </div>
    <div id="review-list"></div>
    <button class="btn btn-secondary" onclick="showResult()">← Back to Results</button>
    <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Tests</button>
  </div>

</div>

<script>
let currentQuiz = null;
let isTranslated = false;
let originalQuestionText = '';
let originalOptionTexts = [];
let currentQuestions = [];
let currentIdx = 0;
let score = 0;
let mistakes = [];
let answered = false;

// ============================================================
// QUESTIONS DATABASE (embedded for instant loading)
// ============================================================
let allQuizzes = [
  {
    title: "🎓 Soma Final Exam — 100 Questions",
    description: "The Soma Institute — 100 random questions from all topics",
    code: "FINAL",
    isFinal: true,
    questions: []
  },
  {
    title: "CI3 — Test #2 (CI3 · T2)",
    description: "The Soma Institute — Clinical Integration 3: Lumbar Spine Assessment, Spring Tests, ROM, Special Tests",
    code: "CI3 · T2",
    questions: [
      { question: "When assessing the lumbar spine using the spring tests, which direction is the spinous process pushed when checking for flexion?", options: ["Inferior direction", "Superior direction", "Lateral direction", "Transverse direction"], correct: 1 },
      { question: "Which of the following is the correct Active Range of Motion for thoracolumbar flexion?", options: ["75-85 degrees", "80-90 degrees", "20-45 degrees", "170-180 degrees"], correct: 0 },
      { question: "Which of the following tests places a stretch on the sciatic nerve?", options: ["Valsalva's Test", "Tinel's Test", "Straight Leg Raise Test", "Femoral Stretch Test"], correct: 2 },
      { question: "Which of the following is testing for a facet joint irritation?", options: ["Phalen's Test", "Valsalva's Test", "Straight Leg Raise Test", "Kemp's Test"], correct: 3 },
      { question: "During a Valsalva's Maneuver, what is the client asked to do for the test?", options: ["Abduct shoulder against resistance", "Flex hips and raise head at the same time", "Rotate head and then extend head, hold position for 30 seconds", "Sit in a chair, lean forward and bear down as if defecating"], correct: 3 },
      { question: "Why is the foot dorsiflexed and the head and neck flexed during the performance of the Straight Leg Raise Test with Braggard's Sign?", options: ["To restretch the quadriceps muscle group", "To differentiate hamstring involvement from nerve root involvement", "To relieve pressure from the iliopsoas", "To relieve the pressure on the sciatic nerve"], correct: 1 },
      { question: "During the Straight Leg Raise Test with Braggard's Sign, which is the correct procedure?", options: ["Supine, both knees to chest, move client to edge of table, release and extend test leg off side of table", "Supine, form a 'Figure Four' with client's legs, push down on bent knee and opposite iliac bone", "Standing, client places hands on hips, stands on one leg, extends backwards", "Supine, lift the affected leg until symptoms are reproduced, then drop leg 10 degrees and have the client dorsiflex the foot and flex their head and neck"], correct: 3 },
      { question: "Which of the following is considered correct Active Range of Motion for thoracolumbar rotation?", options: ["75-80 degrees", "20-30 degrees", "35-45 degrees", "65-75 degrees"], correct: 2 },
      { question: "Which of the following muscles are you testing the strength of during a manual resistive test for lumbar flexion?", options: ["Rectus Abdominis", "Quadratus Lumborum", "Erector Spinae group", "All of the above"], correct: 0 },
      { question: "Your client complains of sharp, shooting pain and numbness in the anterior and medial portion of their left leg and weakness in the left thigh when walking. Which special test would you perform?", options: ["Side-lying prone knee bend test (Femoral Stretch Test)", "Kemp's Test", "Valsalva's Maneuver", "Tinel's Test"], correct: 0 },
      { question: "Which of the following is considered correct Active Range of Motion for thoracolumbar lateral flexion?", options: ["150 degrees", "35-45 degrees", "10-30 degrees", "90 degrees"], correct: 1 },
      { question: "True or False: The end-feel for passive lumbar flexion should be bony.", options: ["True", "False"], correct: 1 },
      { question: "True or False: The correct Active Range of Motion for lumbar flexion should be 75-85 degrees.", options: ["True", "False"], correct: 0 },
      { question: "True or False: A positive finding for Valsalva's test is a decrease in low back pain and a decrease in pain traveling down the leg.", options: ["True", "False"], correct: 1 },
      { question: "True or False: The Straight Leg Raise Test is used to assess a client for facet joint irritation.", options: ["True", "False"], correct: 1 },
      { question: "True or False: The correct Active Range of Motion for thoracolumbar extension is 35-45 degrees.", options: ["True", "False"], correct: 1 },
      { question: "True or False: Herniated discs in the lumbar spine can produce back pain as well as pain down one or both legs.", options: ["True", "False"], correct: 0 },

function buildFinalExam() {
  const quizzes = allQuizzes.filter(q => !q.isFinal);
  const totalQ = quizzes.reduce((sum, q) => sum + q.questions.length, 0);
  let pool = [];
  quizzes.forEach(q => {
    const count = Math.max(1, Math.round(100 * q.questions.length / totalQ));
    const picked = shuffle([...q.questions]).slice(0, count);
    picked.forEach(question => pool.push(Object.assign({}, question, { source: q.code })));
  });
  pool = shuffle(pool);
  if (pool.length > 100) pool = pool.slice(0, 100);
  // Pad to 100 if slightly under (due to rounding)
  if (pool.length < 100) {
    const all = [];
    quizzes.forEach(q => q.questions.forEach(question =>
      all.push(Object.assign({}, question, { source: q.code }))
    ));
    shuffle(all);
    const existing = new Set(pool.map(p => p.question));
    for (const q of all) {
      if (pool.length >= 100) break;
      if (!existing.has(q.question)) { pool.push(q); existing.add(q.question); }
    }
  }
  return pool;
}

async function toggleTranslate() {
  const tBtn = document.getElementById('translate-btn');

  if (isTranslated) {
    // Restore original English
    document.getElementById('question-text').textContent = originalQuestionText;
    document.querySelectorAll('.answer-text').forEach((el, i) => {
      if (originalOptionTexts[i] !== undefined) el.textContent = originalOptionTexts[i];
    });
    tBtn.textContent = '🇷🇺 RU';
    isTranslated = false;
    return;
  }

  tBtn.textContent = '⏳';
  tBtn.disabled = true;

  const texts = [originalQuestionText, ...originalOptionTexts];
  try {
    const translations = await Promise.all(
      texts.map(text =>
        fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|ru')
          .then(r => r.json())
          .then(d => d.responseData.translatedText || text)
          .catch(() => text)
      )
    );
    document.getElementById('question-text').textContent = translations[0];
    document.querySelectorAll('.answer-text').forEach((el, i) => {
      if (translations[i + 1] !== undefined) el.textContent = translations[i + 1];
    });
    tBtn.textContent = '🇺🇸 EN';
    isTranslated = true;
  } catch(e) {
    tBtn.textContent = '🇷🇺 RU';
  }
  tBtn.disabled = false;
}

function loadQuestions() {
  renderHome();
}

function renderHome() {
  const list = document.getElementById('quiz-list');
  if (allQuizzes.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📸</div>
      No tests yet<br><br>
      Take a photo of your printed test and send it to me in Telegram — I'll add it here!
    </div>`;
    return;
  }
  const bankTotal = allQuizzes.filter(x => !x.isFinal).reduce((s, x) => s + x.questions.length, 0);
  list.innerHTML = allQuizzes.map((q, i) => {
    const meta = q.isFinal
      ? `100 random questions · drawn from ${bankTotal}-question bank`
      : `${q.questions.length} questions${q.description ? ' · ' + q.description : ''}`;
    return `
    <div class="quiz-card${q.isFinal ? ' final' : ''}" onclick="startQuiz(${i})">
      <div class="quiz-card-title">${q.title}</div>
      <div class="quiz-card-meta">${meta}</div>
      <div class="quiz-card-arrow">›</div>
    </div>
  `;
  }).join('');
}

function startQuiz(idx) {
  currentQuiz = allQuizzes[idx];
  currentQuestions = currentQuiz.isFinal ? buildFinalExam() : shuffle([...currentQuiz.questions]);
  currentIdx = 0; score = 0; mistakes = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function retryQuiz() {
  currentQuestions = currentQuiz.isFinal ? buildFinalExam() : shuffle([...currentQuiz.questions]);
  currentIdx = 0; score = 0; mistakes = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = currentQuestions[currentIdx];
  const total = currentQuestions.length;

  document.getElementById('progress-fill').style.width = ((currentIdx / total) * 100) + '%';
  document.getElementById('progress-text').textContent = (currentIdx + 1) + ' / ' + total;
  document.getElementById('question-num').textContent = 'Question ' + (currentIdx + 1);
  document.getElementById('question-text').textContent = q.question;

  const srcEl = document.getElementById('question-source');
  if (q.source) {
    srcEl.textContent = '(' + q.source + ')';
    srcEl.style.display = 'block';
  } else {
    srcEl.style.display = 'none';
  }

  const opts = shuffle(q.options.map((text, i) => ({ text, correct: i === q.correct })));
  document.getElementById('answers').innerHTML = opts.map(opt => `
    <button class="answer-btn" onclick="selectAnswer(this, ${opt.correct})">
      <span class="answer-text">${opt.text}</span>
      <span class="answer-icon"></span>
    </button>
  `).join('');

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';

  // Reset translate state
  isTranslated = false;
  originalQuestionText = q.question;
  originalOptionTexts = Array.from(document.querySelectorAll('.answer-text')).map(el => el.textContent);
  const tBtn = document.getElementById('translate-btn');
  tBtn.textContent = '🇷🇺 RU';
  tBtn.disabled = false;
}

function selectAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  const q = currentQuestions[currentIdx];
  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    btn.querySelector('.answer-icon').textContent = '✅';
    score++;
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.answer-icon').textContent = '❌';
    allBtns.forEach(b => {
      const txt = b.querySelector('.answer-text').textContent.trim();
      if (txt === q.options[q.correct]) {
        b.classList.add('show-correct');
        b.querySelector('.answer-icon').textContent = '✅';
      }
    });
    mistakes.push({
      question: q.question,
      yourAnswer: btn.querySelector('.answer-text').textContent.trim(),
      correctAnswer: q.options[q.correct]
    });
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✅ Correct!' : '❌ Wrong. The correct answer is highlighted in green.';
  fb.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIdx + 1 >= currentQuestions.length ? '🏁 Finish Quiz' : 'Next Question →';
}

function nextQuestion() {
  currentIdx++;
  currentIdx >= currentQuestions.length ? showResult() : renderQuestion();
}

function showResult() {
  const total = currentQuestions.length;
  const pct = Math.round((score / total) * 100);
  let emoji, title;
  if (pct >= 90) { emoji = '🏆'; title = 'Excellent result!'; }
  else if (pct >= 70) { emoji = '🎯'; title = 'Good job!'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Keep studying!'; }
  else { emoji = '💪'; title = 'You can do better!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = currentQuiz.title;
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = total - score;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('circle-pct').textContent = pct + '%';

  const circumference = 339;
  const circle = document.getElementById('circle-fill');
  circle.style.stroke = pct >= 70 ? '#1adb6e' : pct >= 50 ? '#f0c040' : '#e94560';
  setTimeout(() => { circle.style.strokeDashoffset = circumference - (pct / 100) * circumference; }, 100);
  document.getElementById('btn-review').style.display = mistakes.length > 0 ? 'block' : 'none';
  showScreen('screen-result');
}

function showReview() {
  const list = document.getElementById('review-list');
  list.innerHTML = mistakes.length === 0
    ? '<div style="color:#1adb6e;font-size:18px;text-align:center;padding:20px">🎉 No mistakes!</div>'
    : mistakes.map((m, i) => `
        <div class="review-item">
          <div class="review-q">${i+1}. ${m.question}</div>
          <div class="review-your">❌ Your answer: ${m.yourAnswer}</div>
          <div class="review-correct">✅ Correct: ${m.correctAnswer}</div>
        </div>`).join('');
  showScreen('screen-review');
}

function showScreen(id) {
  ['screen-home','screen-quiz','screen-result','screen-review'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}
function goHome() { showScreen('screen-home'); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

loadQuestions();
